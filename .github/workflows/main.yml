name: main
on:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: bahmutov/npm-install@v1
      - run: yarn build
      - run: yarn lint
      - run: yarn test
